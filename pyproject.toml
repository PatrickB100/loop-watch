[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopwatch"
version = "0.1.0"
description = "Watches Cisco switches over SSH and reports where a layer-2 loop entered the network"
requires-python = ">=3.12"
dependencies = [
    "netmiko",
    "ntc-templates",
    "PyYAML",
    "click",
    "Jinja2",
    "netaddr",
    "aiohttp",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-aiohttp"]

[project.scripts]
loop-watch = "loopwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loopwatch"]

[tool.hatch.build]
include = ["src/loopwatch/**/*.py", "src/loopwatch/report/templates/*.j2", "src/loopwatch/web/templates/*.j2", "src/loopwatch/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
